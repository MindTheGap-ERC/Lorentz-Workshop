project:
  type: book
  output-dir: ../docs

book:
  title: "Bridging Stratigraphic Palaeobiology and Phylogenetics"
  author: "Emilia Jarochowska, Rachel Warnock, Johannes Hidding, Laura Mulvey, Niklas Hohmann"
  date: "8/18/2026"
  chapters:
    - index.qmd
    - part: "Day 1: Stratigraphy"
      chapters:
        - stratigraphic_paleobiology.qmd
        - CarboKitten_tutorial.qmd
        - adms.qmd
    - part: "Day 2: Fossils"
      chapters:
        - day2/Intro_morpho.qmd
        - day2/morphsim_tutorial.qmd
        - day2/complex_models.qmd
        - day2/Model-RevBayes.qmd
    - part: "Day 3: Tree inference"
      chapters:
        - day3/day3.qmd
    - part: "Day 4: Analysis and software"
    - part: "Day 5: Results"
    - references.qmd

bibliography: references.bib

# Cache chapter outputs in book/_freeze/ so a full-project render does not
# require both Julia and R to be installed. Only edited chapters re-execute.
# Commit _freeze/ along with any re-rendered chapter.
execute:
  freeze: auto

format:
  html:
    theme: cosmo
  pdf:
    documentclass: scrreprt
